[workspace]
authors = ["rifusaki <martina@rifusaki.com>"]
channels = ["conda-forge"]
name = "fsqed-laser-electron"
platforms = ["osx-arm64", "win-64", "linux-64"]
version = "0.1.0"

[tasks]
test = "pytest -q"

[dependencies]
python = ">=3.11,<3.13"
numpy = ">=2.0"
scipy = ">=1.12"
numba = ">=0.59"
jsonschema = ">=4.21"
matplotlib = ">=3.8"
pillow = ">=10.0"
pytest = ">=8.0"
ipykernel = ">=6.29"
jupyterlab = ">=4.1"
